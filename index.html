<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDChat - Smart Web Messaging & Translator</title>
  <style>
    :root {
      --primary: #0084ff;
      --primary-hover: #0066cc;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      background: #0b0f19; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      color: var(--text-main);
    }

    .app-container { 
      width: 100%; 
      max-width: 460px; 
      background: var(--surface); 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5); 
      position: relative; 
      overflow: hidden; 
    }

    @media (min-height: 700px) and (min-width: 480px) {
      .app-container {
        height: 92vh;
        border-radius: 20px;
      }
    }

    .header { 
      background: var(--surface); 
      color: var(--text-main); 
      padding: 14px 18px; 
      font-size: 20px; 
      font-weight: 700; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border);
    }

    .user-card { 
      background: var(--surface-subtle); 
      padding: 10px 18px; 
      font-size: 13px; 
      color: var(--text-muted); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
    }

    .user-card b { color: var(--primary); }

    .nav-tabs { display: flex; background: #f1f5f9; border-bottom: 1px solid var(--border); }
    .nav-tab { 
      flex: 1; 
      padding: 12px; 
      text-align: center; 
      background: transparent; 
      border: none; 
      font-weight: 600; 
      font-size: 13px;
      cursor: pointer; 
      color: var(--text-muted); 
      transition: all 0.2s;
    }
    .nav-tab.active { 
      background: var(--surface); 
      color: var(--primary); 
      border-bottom: 2px solid var(--primary); 
    }

    .auth-overlay { 
      position: absolute; 
      inset: 0; 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(8px);
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 1000; 
    }
    
    .auth-box { 
      background: white; 
      padding: 28px 22px; 
      border-radius: 16px; 
      width: 88%; 
      max-width: 340px; 
      text-align: center; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .auth-box h3 { font-size: 22px; }
    .auth-box input { 
      width: 100%; 
      padding: 12px 14px; 
      margin: 6px 0; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      outline: none;
      font-size: 14px;
      transition: border 0.2s;
    }
    .auth-box input:focus { border-color: var(--primary); }
    .auth-box button { 
      width: 100%; 
      padding: 12px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 8px; 
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .auth-box button:hover { opacity: 0.9; }

    .search-box { padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; background: var(--surface); }
    .search-box input { 
      flex: 1; 
      padding: 10px 16px; 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      outline: none; 
      font-size: 14px;
      background: var(--surface-subtle);
    }
    .search-box button { 
      padding: 10px 18px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 20px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 13px;
    }

    .recent-contacts { padding: 8px 12px; background: var(--surface-subtle); border-bottom: 1px solid var(--border); display: flex; gap: 8px; overflow-x: auto; }
    .contact-chip { 
      background: white; 
      border: 1px solid var(--border);
      border-radius: 16px; 
      padding: 5px 12px; 
      font-size: 12px; 
      color: var(--text-main); 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      white-space: nowrap;
      transition: all 0.2s;
    }
    .contact-chip:hover { border-color: var(--primary); color: var(--primary); }
    .unread-dot { width: 8px; height: 8px; background-color: var(--danger); border-radius: 50%; display: inline-block; }

    .content-section { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .content-section.active { display: flex; }

    .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
    
    .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; display: flex; flex-direction: column; }
    .message.sent { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 4px rgba(0,132,255,0.2); }
    .message.received { background: white; color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    .msg-sender { font-size: 11px; font-weight: bold; margin-bottom: 2px; color: #0284c7; }
    .msg-time { font-size: 10px; opacity: 0.7; align-self: flex-end; margin-top: 4px; }

    /* Translator Button & Box UI */
    .translate-btn {
      font-size: 10px;
      margin-top: 4px;
      cursor: pointer;
      opacity: 0.8;
      display: inline-block;
      text-decoration: underline;
      align-self: flex-start;
    }
    .message.sent .translate-btn { color: #e0f2fe; }
    .message.received .translate-btn { color: var(--primary); }
    
    .translated-text {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.4);
      font-size: 12px;
      font-style: italic;
    }
    .message.received .translated-text {
      border-top: 1px dashed var(--border);
      color: #334155;
    }

    .input-area { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; background: white; }
    .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
    .input-area textarea { 
      width: 100%; 
      height: 42px; 
      max-height: 120px; 
      padding: 10px 36px 10px 14px; 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      outline: none; 
      font-size: 14px; 
      line-height: 1.4; 
      resize: none; 
      background: var(--surface-subtle);
    }
    .input-area textarea:focus { border-color: var(--primary); background: white; }
    .clear-btn { position: absolute; right: 12px; background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; display: none; }
    
    .file-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .input-area button.send-btn { background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 16px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; transition: transform 0.1s; }
    .input-area button.send-btn:active { transform: scale(0.95); }

    .top-notification {
      position: absolute;
      top: -80px;
      left: 12px;
      right: 12px;
      background: #1e293b;
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 3000;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .top-notification.show { top: 12px; }
    .banner-content { display: flex; flex-direction: column; gap: 2px; overflow: hidden; max-width: 78%; }
    .banner-title { font-weight: 600; color: #38bdf8; font-size: 12px; }
    .banner-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: #f1f5f9; }

    .group-selection-box { padding: 12px; background: var(--surface-subtle); border-bottom: 1px solid var(--border); display: flex; gap: 8px; overflow-x: auto; }
    .group-card-btn { background: white; border: 1px solid var(--border); padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .group-card-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
  </style>
</head>
<body>

  <div class="top-notification" id="topBanner" onclick="clickBanner()">
    <div class="banner-content">
      <span class="banner-title" id="bannerTitle">💬 မက်ဆေ့ခ်ျအသစ်</span>
      <span class="banner-msg" id="bannerText">စာဝင်လာပါသည်</span>
    </div>
    <small style="background: #0284c7; color: white; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;">ကြည့်မည်</small>
  </div>

  <div class="auth-overlay" id="authModal">
    <div class="auth-box">
      <h3 style="color: var(--primary); margin-bottom: 4px;">IDChat</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Username သတ်မှတ်၍ စတင်အသုံးပြုပါ</p>
      <input type="text" id="regName" placeholder="သင့်အမည် (ဥပမာ - Mya Mya)">
      <input type="text" id="regUsername" placeholder="Username (ဥပမာ - myamya)">
      <input type="password" id="regPass" placeholder="စကားဝှက်">
      <button onclick="handleRegister()">အကောင့်အသစ်ဖွင့်မည်</button>
      <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);">
      <input type="text" id="loginUsername" placeholder="Username ဖြင့် Login ဝင်ရန်">
      <button onclick="handleLogin()" style="background: #475569;">Login ဝင်မည်</button>
    </div>
  </div>

  <div class="app-container">
    <div class="header">
      <span>IDChat</span>
      <span style="font-size: 12px; background: #e0f2fe; color: #0284c7; padding: 4px 10px; border-radius: 12px;">🌐 Translator Active</span>
    </div>
    
    <div class="user-card">
      <span>အကောင့်: <b id="userNameDisplay">-</b></span>
      <span>Username: <b id="myUsernameDisplay">-</b></span>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('chatTab', this)">💬 Direct Chat</button>
      <button class="nav-tab" onclick="switchTab('groupTab', this)">👨‍👩‍👧‍👦 Family & Groups</button>
    </div>

    <!-- TAB 1: DIRECT CHAT -->
    <div id="chatTab" class="content-section active">
      <div class="search-box">
        <input type="text" id="targetUsernameInput" placeholder="သူငယ်ချင်း Username ရိုက်ထည့်ပါ">
        <button onclick="connectChat()">စကားပြောမည်</button>
      </div>

      <div class="recent-contacts" id="recentContacts">
        <span style="font-size: 12px; color: var(--text-muted); align-self: center;">အဆက်အသွယ်များ: </span>
      </div>

      <div class="chat-area" id="chatArea">
        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;">
          Username ရိုက်ထည့်၍ စကားစတင်ပြောပါ
        </div>
      </div>

      <div class="input-area">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event, 'direct')">
        <button class="file-btn" onclick="document.getElementById('imageInput').click()" title="ဓာတ်ပုံ ပို့ရန်">🖼️</button>
        <div class="input-wrapper">
          <textarea id="msgInput" placeholder="စာရိုက်ပါ..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event, 'direct')"></textarea>
          <button class="clear-btn" id="clearBtn" onclick="clearInput('msgInput', 'clearBtn')">✖</button>
        </div>
        <button class="send-btn" onclick="sendTextMessage('direct')">➤</button>
      </div>
    </div>

    <!-- TAB 2: GROUP CHAT HUB -->
    <div id="groupTab" class="content-section">
      <div class="group-selection-box">
        <button class="group-card-btn active" onclick="selectGroup('family_group', this)">🏠 Family Group</button>
        <button class="group-card-btn" onclick="selectGroup('learning_group', this)">📚 Learning Hub</button>
        <button class="group-card-btn" onclick="selectGroup('friends_group', this)">🎉 Friends Corner</button>
      </div>

      <div class="chat-area" id="groupChatArea">
        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;">
          Group ကို ရွေးချယ်ပြီး စကားပြောဆိုပါ
        </div>
      </div>

      <div class="input-area">
        <input type="file" id="groupImageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event, 'group')">
        <button class="file-btn" onclick="document.getElementById('groupImageInput').click()" title="ဓာတ်ပုံ ပို့ရန်">🖼️</button>
        <div class="input-wrapper">
          <textarea id="groupMsgInput" placeholder="Group သို့ စာရိုက်ပါ..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event, 'group')"></textarea>
          <button class="clear-btn" id="groupClearBtn" onclick="clearInput('groupMsgInput', 'groupClearBtn')">✖</button>
        </div>
        <button class="send-btn" onclick="sendTextMessage('group')">➤</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD81JR9IoFkwGbkq0UWQ4aqfgwwpvLg668",
      authDomain: "idchat-2bc95.firebaseapp.com",
      databaseURL: "https://idchat-2bc95-default-rtdb.firebaseio.com",
      projectId: "idchat-2bc95",
      storageBucket: "idchat-2bc95.firebasestorage.app",
      messagingSenderId: "698756711127",
      appId: "1:698756711127:web:873c465228b2d0976fa692"
    };

    const VAPID_KEY = "j_lqz-M7dGuGLy0qwUKXNN5ZiCNBv9Cthup4L2KY-h8";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let messaging = null;

    try { messaging = getMessaging(app); } catch(e) {}

    let currentUser = null;
    let targetUser = null;
    let currentChatID = null;
    let currentGroupID = "family_group";
    
    let unsubscribeChat = null;
    let unsubscribeGroupChat = null;
    let bgListeners = [];
    let unreadMap = {};
    let bannerTargetUser = null;
    let bannerTimeout = null;

    async function setupFCM(userID) {
      if (!messaging) return;
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const token = await getToken(messaging, { vapidKey: VAPID_KEY });
          if (token) await updateDoc(doc(db, "users", userID), { fcmToken: token });
        }
      } catch (err) {}
    }

    if (messaging) {
      onMessage(messaging, (payload) => {
        if (payload.notification) {
          showBannerNotification(payload.notification.title || 'Message', payload.notification.body || '');
        }
      });
    }

    /* ----------------------------------------------------
       API KEY မလိုသော DIRECT TRANSLATION ENGINE
    ---------------------------------------------------- */
    window.translateMsg = async (msgId, text, targetLang = 'my') => {
      const container = document.getElementById(`trans_${msgId}`);
      if (!container) return;

      container.style.display = "block";
      container.innerText = "🌐 ဘာသာပြန်နေပါသည်...";

      try {
        // Public Free Google Translate Endpoint (API Key မလိုပါ)
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        let translatedText = "";
        if (data && data[0]) {
          translatedText = data[0].map(item => item[0]).join('');
        }

        if (translatedText) {
          container.innerHTML = `<b>Translated (${targetLang.toUpperCase()}):</b> ${translatedText}`;
        } else {
          container.innerText = "ဘာသာပြန်၍ မရပါခင်ဗျာ။";
        }
      } catch (err) {
        container.innerText = "ကွန်ရက် အခက်အခဲကြောင့် ဘာသာပြန်၍ မရပါ။";
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("idchat_active_user");
      if (savedUser) {
        try {
          const userObj = JSON.parse(savedUser);
          loginSuccess(userObj.userID, userObj.name, userObj.username, false);
        } catch(e) {}
      }
    });

    window.switchTab = (tabId, element) => {
      document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
      if (tabId === 'groupTab') loadGroupMessages();
    };

    window.selectGroup = (groupId, btn) => {
      document.querySelectorAll('.group-card-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      currentGroupID = groupId;
      loadGroupMessages();
    };

    window.autoResize = (textarea) => {
      textarea.style.height = '42px';
      if (textarea.scrollHeight > 42) {
        textarea.style.height = (textarea.scrollHeight < 120 ? textarea.scrollHeight : 120) + 'px';
      }
    };

    window.handleKeyDown = (event, mode) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        window.sendTextMessage(mode);
      }
    };

    window.clearInput = (inputId, btnId) => {
      const input = document.getElementById(inputId);
      input.value = '';
      input.style.height = '42px';
      document.getElementById(btnId).style.display = 'none';
      input.focus();
    };

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showBannerNotification(senderUsername, text) {
      bannerTargetUser = senderUsername;
      const banner = document.getElementById("topBanner");
      document.getElementById("bannerTitle").innerText = `💬 @${senderUsername}`;
      document.getElementById("bannerText").innerText = text;
      
      banner.classList.add("show");
      if (bannerTimeout) clearTimeout(bannerTimeout);

      bannerTimeout = setTimeout(() => {
        banner.classList.remove("show");
      }, 3500);
    }

    window.clickBanner = () => {
      if (bannerTimeout) clearTimeout(bannerTimeout);
      document.getElementById("topBanner").classList.remove("show");
      if (bannerTargetUser) {
        document.getElementById("targetUsernameInput").value = bannerTargetUser;
        window.connectChat(bannerTargetUser);
      }
    };

    async function generateUniqueID() {
      let isUnique = false, newID = "";
      while (!isUnique) {
        newID = Math.floor(100000 + Math.random() * 900000).toString();
        const docSnap = await getDoc(doc(db, "users", newID));
        if (!docSnap.exists()) isUnique = true;
      }
      return newID;
    }

    window.handleRegister = async () => {
      const name = document.getElementById("regName").value.trim();
      const username = document.getElementById("regUsername").value.trim().toLowerCase().replace("@","");
      const pass = document.getElementById("regPass").value.trim();
      
      if (!name || !username || !pass) return alert("အချက်အလက်များကို ပြည့်စုံစွာ ရိုက်ထည့်ပါ!");

      const uSnap = await getDoc(doc(db, "usernames", username));
      if (uSnap.exists()) return alert("ဤ Username ယူထားပြီးဖြစ်ပါသည်။ အခြားနာမည်ပြောင်းပါ!");

      const userID = await generateUniqueID();
      
      await setDoc(doc(db, "users", userID), { userID, name, username, password: pass, createdAt: serverTimestamp() });
      await setDoc(doc(db, "usernames", username), { userID });
      
      alert(`အကောင့် အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ!\nသင့်၏ Username: @${username}`);
      loginSuccess(userID, name, username);
    };

    window.handleLogin = async () => {
      const username = document.getElementById("loginUsername").value.trim().toLowerCase().replace("@","");
      if (!username) return alert("Username ရိုက်ထည့်ပါ!");
      
      try {
        const uSnap = await getDoc(doc(db, "usernames", username));
        if (uSnap.exists()) {
          const userID = uSnap.data().userID;
          const userDoc = await getDoc(doc(db, "users", userID));
          if (userDoc.exists()) loginSuccess(userID, userDoc.data().name, username);
        } else { alert("ဤ Username ဖြင့် အကောင့်မရှိပါ။ အကောင့်အသစ် အရင်ဖွင့်ပါ။"); }
      } catch (error) { alert("Login ဝင်ရာတွင် အမှားအယွင်း ရှိနေပါသည်။"); }
    };

    function loginSuccess(userID, name, username, saveToStorage = true) {
      currentUser = { userID, name, username };
      if (saveToStorage) localStorage.setItem("idchat_active_user", JSON.stringify(currentUser));

      document.getElementById("myUsernameDisplay").innerText = "@" + username;
      const userCard = document.getElementById("userNameDisplay").parentElement;
      if (!document.getElementById("logoutBtn")) {
        const logoutBtn = document.createElement("span");
        logoutBtn.id = "logoutBtn";
        logoutBtn.style.cssText = "color: var(--danger); cursor: pointer; margin-left: 8px; font-size: 11px; text-decoration: underline;";
        logoutBtn.innerText = "[ထွက်မည်]";
        logoutBtn.onclick = window.handleLogout;
        userCard.appendChild(logoutBtn);
      }
      
      document.getElementById("userNameDisplay").innerText = name;
      document.getElementById("authModal").style.display = "none";
      
      setupFCM(userID);
      loadRecentContacts();
      listenForBackgroundMessages();
    }

    window.handleLogout = () => {
      if (confirm("အကောင့်ထဲမှ ထွက်ရန် သေချာပါသလား?")) {
        localStorage.removeItem("idchat_active_user");
        location.reload();
      }
    };

    window.connectChat = async (targetUsername = null) => {
      const uname = targetUsername || document.getElementById("targetUsernameInput").value.trim().toLowerCase().replace("@","");
      if (!uname || (currentUser && uname === currentUser.username)) return alert("မှန်ကန်သော Username ရိုက်ထည့်ပါ!");

      const uSnap = await getDoc(doc(db, "usernames", uname));
      if (!uSnap.exists()) return alert("ဤ Username ဖြင့် အသုံးပြုသူ ရှာမတွေ့ပါ!");

      const targetID = uSnap.data().userID;
      const tUserDoc = await getDoc(doc(db, "users", targetID));
      
      targetUser = { userID: targetID, name: tUserDoc.data().name, username: uname };
      currentChatID = [currentUser.userID, targetID].sort().join("_");
      
      if (unreadMap[uname]) delete unreadMap[uname];
      saveRecentContact(targetUser);
      loadMessages();
    };

    function saveRecentContact(user) {
      let contacts = JSON.parse(localStorage.getItem("recent_contacts") || "[]");
      if (!contacts.some(c => c.username === user.username)) {
        contacts.push(user);
        localStorage.setItem("recent_contacts", JSON.stringify(contacts));
      }
      loadRecentContacts();
    }

    function loadRecentContacts() {
      let contacts = JSON.parse(localStorage.getItem("recent_contacts") || "[]");
      const container = document.getElementById("recentContacts");
      container.innerHTML = '<span style="font-size: 12px; color: var(--text-muted); align-self: center;">အဆက်အသွယ်များ: </span>';
      contacts.forEach(c => {
        const chip = document.createElement("div");
        chip.className = "contact-chip";
        chip.innerHTML = `@${c.username}` + (unreadMap[c.username] ? ' <span class="unread-dot"></span>' : '');
        chip.onclick = () => {
          document.getElementById("targetUsernameInput").value = c.username;
          window.connectChat(c.username);
        };
        container.appendChild(chip);
      });
    }

    function listenForBackgroundMessages() {
      bgListeners.forEach(unsub => unsub());
      bgListeners = [];
      let contacts = JSON.parse(localStorage.getItem("recent_contacts") || "[]");
      contacts.forEach(c => {
        const chatID = [currentUser.userID, c.userID].sort().join("_");
        const q = query(collection(db, "chats", chatID, "messages"), orderBy("timestamp", "desc"));
        let initialLoad = true;
        const unsub = onSnapshot(q, (snapshot) => {
          if (!snapshot.empty) {
            const latestMsg = snapshot.docs[0].data();
            if (!initialLoad && latestMsg.senderID !== currentUser.userID) {
              unreadMap[c.username] = true;
              loadRecentContacts();
              if (!targetUser || targetUser.username !== c.username) {
                showBannerNotification(c.username, latestMsg.type === 'image' ? '[📷 ဓာတ်ပုံ]' : latestMsg.content);
              }
            }
          }
          initialLoad = false;
        });
        bgListeners.push(unsub);
      });
    }

    function loadMessages() {
      if (unsubscribeChat) unsubscribeChat();
      const q = query(collection(db, "chats", currentChatID, "messages"), orderBy("timestamp", "asc"));
      
      unsubscribeChat = onSnapshot(q, (snapshot) => {
        const chatArea = document.getElementById("chatArea");
        chatArea.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const msgId = docSnap.id;
          const msgDiv = document.createElement("div");
          const timeStr = formatTime(msg.timestamp);

          if (msg.type === "image") {
            const isMe = msg.senderID === currentUser.userID;
            msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
            msgDiv.innerHTML = `<img src="${msg.content}" alt="Image"><div class="msg-time">${timeStr}</div>`;
          } else {
            const isMe = msg.senderID === currentUser.userID;
            msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
            
            const cleanText = msg.content.replace(/'/g, "\\'").replace(/"/g, '\\"');
            msgDiv.innerHTML = `
              <div>${msg.content}</div>
              <div id="trans_${msgId}" class="translated-text" style="display:none;"></div>
              <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span class="translate-btn" onclick="translateMsg('${msgId}', '${cleanText}', 'my')">🌐 ဘာသာပြန်မည်</span>
                <span class="msg-time">${timeStr}</span>
              </div>
            `;
          }

          chatArea.appendChild(msgDiv);
        });
        chatArea.scrollTop = chatArea.scrollHeight;
      });
    }

    function loadGroupMessages() {
      if (unsubscribeGroupChat) unsubscribeGroupChat();
      const q = query(collection(db, "groups", currentGroupID, "messages"), orderBy("timestamp", "asc"));
      
      unsubscribeGroupChat = onSnapshot(q, (snapshot) => {
        const groupChatArea = document.getElementById("groupChatArea");
        groupChatArea.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const msgId = docSnap.id;
          const msgDiv = document.createElement("div");
          const timeStr = formatTime(msg.timestamp);
          const isMe = msg.senderID === currentUser.userID;

          msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
          let senderHtml = !isMe ? `<div class="msg-sender">@${msg.senderUsername}</div>` : '';
          
          if (msg.type === "image") {
            msgDiv.innerHTML = `${senderHtml}<img src="${msg.content}" alt="Image"><div class="msg-time">${timeStr}</div>`;
          } else {
            const cleanText = msg.content.replace(/'/g, "\\'").replace(/"/g, '\\"');
            msgDiv.innerHTML = `
              ${senderHtml}
              <div>${msg.content}</div>
              <div id="trans_${msgId}" class="translated-text" style="display:none;"></div>
              <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span class="translate-btn" onclick="translateMsg('${msgId}', '${cleanText}', 'my')">🌐 ဘာသာပြန်မည်</span>
                <span class="msg-time">${timeStr}</span>
              </div>
            `;
          }

          groupChatArea.appendChild(msgDiv);
        });
        groupChatArea.scrollTop = groupChatArea.scrollHeight;
      });
    }

    window.sendTextMessage = async (mode = 'direct') => {
      if (mode === 'direct') {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text || !currentChatID) return alert("သူငယ်ချင်း Username အရင် ရိုက်ထည့်ပါ!");
        
        await addDoc(collection(db, "chats", currentChatID, "messages"), {
          senderID: currentUser.userID,
          type: "text",
          content: text,
          timestamp: serverTimestamp()
        });
        window.clearInput('msgInput', 'clearBtn');
      } else {
        const input = document.getElementById("groupMsgInput");
        const text = input.value.trim();
        if (!text) return;

        await addDoc(collection(db, "groups", currentGroupID, "messages"), {
          senderID: currentUser.userID,
          senderUsername: currentUser.username,
          type: "text",
          content: text,
          timestamp: serverTimestamp()
        });
        window.clearInput('groupMsgInput', 'groupClearBtn');
      }
    };

    window.handleImageUpload = (e, mode = 'direct') => {
      const file = e.target.files[0];
      if (!file) return;

      if (mode === 'direct' && !currentChatID) {
        return alert("သူငယ်ချင်း Username အရင် ရိုက်ထည့်ပါ!");
      }

      if (file.size > 1024 * 1024) {
        return alert("ဓာတ်ပုံ ပမာဏ 1MB ထက် နည်းရပါမည်!");
      }

      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Img = event.target.result;
        if (mode === 'direct') {
          await addDoc(collection(db, "chats", currentChatID, "messages"), {
            senderID: currentUser.userID,
            type: "image",
            content: base64Img,
            timestamp: serverTimestamp()
          });
        } else {
          await addDoc(collection(db, "groups", currentGroupID, "messages"), {
            senderID: currentUser.userID,
            senderUsername: currentUser.username,
            type: "image",
            content: base64Img,
            timestamp: serverTimestamp()
          });
        }
      };
      reader.readAsDataURL(file);
    };
  </script>
</body>
</html
